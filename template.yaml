AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: LocalBargain backend (dev stack, ap-southeast-2)

Parameters:
  QrKeyParameterName:
    Type: String
    Default: /localbargain/dev/qr-key
    AllowedPattern: '^/[A-Za-z0-9/_.-]+$'
    Description: SSM SecureString holding the 32-byte HMAC key for lb1 QR values (design D10). Create it once, see README.

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]
    MemorySize: 256
    Timeout: 10
    Environment:
      Variables:
        TABLE_NAME: !Ref Table
        IMAGE_BASE_URL: !Sub 'https://${ImageDistribution.DomainName}/'
        NODE_OPTIONS: --enable-source-maps

Resources:
  # Single table, on demand (design D5).
  Table:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
        - { AttributeName: GSI1PK, AttributeType: S }
        - { AttributeName: GSI1SK, AttributeType: S }
        - { AttributeName: GSI2PK, AttributeType: S }
        - { AttributeName: GSI2SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - { AttributeName: GSI1PK, KeyType: HASH }
            - { AttributeName: GSI1SK, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
        - IndexName: GSI2
          KeySchema:
            - { AttributeName: GSI2PK, KeyType: HASH }
            - { AttributeName: GSI2SK, KeyType: RANGE }
          Projection: { ProjectionType: ALL }

  # Product images: private bucket read by CloudFront through OAC (design D11).
  ImageBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }

  ImageOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-images'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  ImageDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub '${AWS::StackName} product images'
        # Australia and New Zealand edge locations are only in PriceClass_All.
        PriceClass: PriceClass_All
        HttpVersion: http2and3
        Origins:
          - Id: images
            DomainName: !GetAtt ImageBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt ImageOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: images
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          Compress: true
          # Managed CachingOptimized policy. Keys never change content (a new upload gets a new key), so long caching is safe.
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6

  ImageBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ImageBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: CloudFrontReadsOffers
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub '${ImageBucket.Arn}/offers/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${ImageDistribution}'
          - Sid: TlsOnly
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource: [!GetAtt ImageBucket.Arn, !Sub '${ImageBucket.Arn}/*']
            Condition:
              Bool: { aws:SecureTransport: 'false' }

  # Four functions grouped by audience (design D2). Each gets only the access its routes need.
  DiscoveryFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        OutExtension: [.js=.mjs]
        Target: es2023
        Minify: true
        Sourcemap: true
        External: ['@aws-sdk/*']
        EntryPoints: [src/handlers/discovery.ts]
    Properties:
      CodeUri: ./
      Handler: discovery.handler
      LoggingConfig:
        LogGroup: !Ref DiscoveryLogGroup
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:Query
              Resource:
                - !GetAtt Table.Arn
                - !Sub '${Table.Arn}/index/GSI2'

  ConsumerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        OutExtension: [.js=.mjs]
        Target: es2023
        Minify: true
        Sourcemap: true
        External: ['@aws-sdk/*']
        EntryPoints: [src/handlers/consumer.ts]
    Properties:
      CodeUri: ./
      Handler: consumer.handler
      LoggingConfig:
        LogGroup: !Ref ConsumerLogGroup
      Environment:
        Variables:
          QR_KEY_PARAMETER: !Ref QrKeyParameterName
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:Query, dynamodb:UpdateItem]
              Resource:
                - !GetAtt Table.Arn
                - !Sub '${Table.Arn}/index/GSI1'
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${QrKeyParameterName}'

  MerchantFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        OutExtension: [.js=.mjs]
        Target: es2023
        Minify: true
        Sourcemap: true
        External: ['@aws-sdk/*']
        EntryPoints: [src/handlers/merchant.ts]
    Properties:
      CodeUri: ./
      Handler: merchant.handler
      LoggingConfig:
        LogGroup: !Ref MerchantLogGroup
      Environment:
        Variables:
          QR_KEY_PARAMETER: !Ref QrKeyParameterName
          IMAGE_BUCKET: !Ref ImageBucket
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem, dynamodb:Query]
              Resource: !GetAtt Table.Arn
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${QrKeyParameterName}'
            # PutObject signs the presigned POST, GetObject backs HeadObject. The merchant-ID prefix is checked in code.
            - Effect: Allow
              Action: [s3:PutObject, s3:GetObject, s3:DeleteObject]
              Resource: !Sub '${ImageBucket.Arn}/offers/*'

  AdminFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        OutExtension: [.js=.mjs]
        Target: es2023
        Minify: true
        Sourcemap: true
        External: ['@aws-sdk/*']
        EntryPoints: [src/handlers/admin.ts]
    Properties:
      CodeUri: ./
      Handler: admin.handler
      LoggingConfig:
        LogGroup: !Ref AdminLogGroup
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt Table.Arn

  DiscoveryLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/localbargain/${AWS::StackName}/discovery'
      RetentionInDays: 14
  ConsumerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/localbargain/${AWS::StackName}/consumer'
      RetentionInDays: 14
  MerchantLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/localbargain/${AWS::StackName}/merchant'
      RetentionInDays: 14
  AdminLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/localbargain/${AWS::StackName}/admin'
      RetentionInDays: 14

Outputs:
  TableName:
    Value: !Ref Table
  ImageBucketName:
    Value: !Ref ImageBucket
  ImageBaseUrl:
    Value: !Sub 'https://${ImageDistribution.DomainName}/'
