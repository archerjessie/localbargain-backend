AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: LocalBargain backend (dev stack, ap-southeast-2)

Parameters:
  QrKeyParameterName:
    Type: String
    Default: /localbargain/dev/qr-key
    AllowedPattern: '^/[A-Za-z0-9/_.-]+$'
    Description: SSM SecureString holding the base64 encoding of the 32-byte HMAC key for lb1 QR values (design D10). Create it once, see README.
  ConsumerCallbackUrl:
    Type: String
    Default: localbargain://auth/callback
    Description: Redirect URI the consumer app registers for the hosted UI (authorization code + PKCE).
  ConsumerLogoutUrl:
    Type: String
    Default: localbargain://auth/logout
  # Federation is optional (design D3). Leave these empty and the stack still deploys with email sign-in only.
  GoogleClientId:
    Type: String
    Default: ''
  GoogleClientSecret:
    Type: String
    Default: ''
    NoEcho: true
  AppleServicesId:
    Type: String
    Default: ''
  AppleTeamId:
    Type: String
    Default: ''
  AppleKeyId:
    Type: String
    Default: ''
  ApplePrivateKey:
    Type: String
    Default: ''
    NoEcho: true

  EnableSmokeTestAuth:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Allow ADMIN_USER_PASSWORD_AUTH on both app clients, so an operator with IAM credentials can get tokens from the CLI for the smoke test (task 8.2). Turn it off again afterwards.

Rules:
  GoogleAllOrNothing:
    Assertions:
      - Assert: !Or
          - !And [!Equals [!Ref GoogleClientId, ''], !Equals [!Ref GoogleClientSecret, '']]
          - !And [!Not [!Equals [!Ref GoogleClientId, '']], !Not [!Equals [!Ref GoogleClientSecret, '']]]
        AssertDescription: Set both GoogleClientId and GoogleClientSecret, or neither.
  AppleAllOrNothing:
    Assertions:
      - Assert: !Or
          - !And
            - !Equals [!Ref AppleServicesId, '']
            - !Equals [!Ref AppleTeamId, '']
            - !Equals [!Ref AppleKeyId, '']
            - !Equals [!Ref ApplePrivateKey, '']
          - !And
            - !Not [!Equals [!Ref AppleServicesId, '']]
            - !Not [!Equals [!Ref AppleTeamId, '']]
            - !Not [!Equals [!Ref AppleKeyId, '']]
            - !Not [!Equals [!Ref ApplePrivateKey, '']]
        AssertDescription: Set all four Apple parameters, or none.

Conditions:
  SmokeTestAuth: !Equals [!Ref EnableSmokeTestAuth, 'true']
  HasGoogle: !And
    - !Not [!Equals [!Ref GoogleClientId, '']]
    - !Not [!Equals [!Ref GoogleClientSecret, '']]
  HasApple: !And
    - !Not [!Equals [!Ref AppleServicesId, '']]
    - !Not [!Equals [!Ref AppleTeamId, '']]
    - !Not [!Equals [!Ref AppleKeyId, '']]
    - !Not [!Equals [!Ref ApplePrivateKey, '']]

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]
    MemorySize: 256
    Timeout: 10
    Environment:
      Variables:
        TABLE_NAME: !Ref Table
        # Local mode only (design D9). sam local overrides these from local/env.json; deployed they stay empty.
        LOCAL_AUTH: '0'
        DYNAMODB_ENDPOINT: ''

Resources:
  # Single table, on demand (design D5).
  Table:
    Type: AWS::DynamoDB::Table
    # Keep the data if a template change would replace the table. sam delete still removes it (design rollback plan).
    UpdateReplacePolicy: Retain
    DeletionPolicy: Delete
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
        - { AttributeName: GSI1PK, AttributeType: S }
        - { AttributeName: GSI1SK, AttributeType: S }
        - { AttributeName: GSI2PK, AttributeType: S }
        - { AttributeName: GSI2SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - { AttributeName: GSI1PK, KeyType: HASH }
            - { AttributeName: GSI1SK, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
        - IndexName: GSI2
          KeySchema:
            - { AttributeName: GSI2PK, KeyType: HASH }
            - { AttributeName: GSI2SK, KeyType: RANGE }
          Projection: { ProjectionType: ALL }

  # Product images: private bucket read by CloudFront through OAC (design D11).
  ImageBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }

  ImageOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-images'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  ImageDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub '${AWS::StackName} product images'
        # Australia and New Zealand edge locations are only in PriceClass_All.
        PriceClass: PriceClass_All
        HttpVersion: http2and3
        Origins:
          - Id: images
            DomainName: !GetAtt ImageBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt ImageOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: images
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          Compress: true
          # Managed CachingOptimized policy. Keys never change content (a new upload gets a new key), so long caching is safe.
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6

  ImageBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ImageBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: CloudFrontReadsOffers
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub '${ImageBucket.Arn}/offers/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${ImageDistribution}'
          - Sid: TlsOnly
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource: [!GetAtt ImageBucket.Arn, !Sub '${ImageBucket.Arn}/*']
            Condition:
              Bool: { aws:SecureTransport: 'false' }

  # Consumer accounts: self-signup with a verified email, plus optional Google and Apple (design D3, D4).
  ConsumerUserPool:
    Type: AWS::Cognito::UserPool
    # A replacement would delete every consumer account and orphan redemption userIds. sam delete still removes it.
    UpdateReplacePolicy: Retain
    DeletionPolicy: Delete
    Properties:
      UserPoolName: !Sub '${AWS::StackName}-consumers'
      # Lite covers the classic hosted UI and social sign-in. New pools default to Essentials, which costs more.
      UserPoolTier: LITE
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      AccountRecoverySetting:
        RecoveryMechanisms:
          - { Name: verified_email, Priority: 1 }
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
      Schema:
        - { Name: email, AttributeDataType: String, Required: true, Mutable: true }
        - { Name: given_name, AttributeDataType: String, Required: false, Mutable: true }

  ConsumerUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref ConsumerUserPool
      # Hosted UI prefixes are global and lowercase. The first block of the stack's UUID makes one per stack.
      Domain: !Sub
        - 'localbargain-${StackUuidPrefix}'
        - StackUuidPrefix: !Select [0, !Split ['-', !Select [2, !Split ['/', !Ref AWS::StackId]]]]
      ManagedLoginVersion: 1

  GoogleIdentityProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Condition: HasGoogle
    Properties:
      UserPoolId: !Ref ConsumerUserPool
      ProviderName: Google
      ProviderType: Google
      ProviderDetails:
        client_id: !Ref GoogleClientId
        client_secret: !Ref GoogleClientSecret
        authorize_scopes: openid email profile
      AttributeMapping:
        email: email
        email_verified: email_verified
        given_name: given_name

  AppleIdentityProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Condition: HasApple
    Properties:
      UserPoolId: !Ref ConsumerUserPool
      ProviderName: SignInWithApple
      ProviderType: SignInWithApple
      ProviderDetails:
        client_id: !Ref AppleServicesId
        team_id: !Ref AppleTeamId
        key_id: !Ref AppleKeyId
        private_key: !Ref ApplePrivateKey
        authorize_scopes: email name
      # Apple sends the name only on the first authorization, so given_name can be missing. displayName is then null.
      AttributeMapping:
        email: email
        email_verified: email_verified
        given_name: firstName

  ConsumerAppClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref ConsumerUserPool
      ClientName: consumer-app
      # Public client: the app cannot keep a secret, so it uses authorization code + PKCE.
      # Cognito does not require code_challenge, so the consumer app must always send it (redirect is a custom scheme).
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      # aws.cognito.signin.user.admin lets the app set given_name (the display name) after an email sign-up.
      AllowedOAuthScopes: [openid, email, profile, aws.cognito.signin.user.admin]
      CallbackURLs: [!Ref ConsumerCallbackUrl]
      LogoutURLs: [!Ref ConsumerLogoutUrl]
      # Referencing the providers (not DependsOn) makes the client wait for them only when they exist.
      SupportedIdentityProviders:
        - COGNITO
        - !If [HasGoogle, !Ref GoogleIdentityProvider, !Ref AWS::NoValue]
        - !If [HasApple, !Ref AppleIdentityProvider, !Ref AWS::NoValue]
      # Consumers sign in through the hosted UI only (design D3).
      ExplicitAuthFlows: !If
        - SmokeTestAuth
        - [ALLOW_REFRESH_TOKEN_AUTH, ALLOW_ADMIN_USER_PASSWORD_AUTH]
        - [ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true

  # Merchant accounts: created by an admin only, one per shop, email as the username (design D3).
  MerchantUserPool:
    Type: AWS::Cognito::UserPool
    # A replacement would delete every merchant account, and merchantId is the pool sub. sam delete still removes it.
    UpdateReplacePolicy: Retain
    DeletionPolicy: Delete
    Properties:
      UserPoolName: !Sub '${AWS::StackName}-merchants'
      UserPoolTier: LITE
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AdminCreateUserConfig:
        # No self-signup. AdminCreateUser emails a temporary password, and the first sign-in must set a new one.
        AllowAdminCreateUserOnly: true
        InviteMessageTemplate:
          EmailSubject: Your LocalBargain merchant account
          EmailMessage: 'Your LocalBargain merchant account is ready. Sign in to the merchant app with {username} and the temporary password {####}. You will be asked to choose a new password.'
      AccountRecoverySetting:
        RecoveryMechanisms:
          - { Name: verified_email, Priority: 1 }
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
          TemporaryPasswordValidityDays: 7
      Schema:
        - { Name: email, AttributeDataType: String, Required: true, Mutable: true }

  MerchantAppClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref MerchantUserPool
      ClientName: merchant-app
      GenerateSecret: false
      # SRP keeps the password off the wire.
      ExplicitAuthFlows: !If
        - SmokeTestAuth
        - [ALLOW_USER_SRP_AUTH, ALLOW_REFRESH_TOKEN_AUTH, ALLOW_ADMIN_USER_PASSWORD_AUTH]
        - [ALLOW_USER_SRP_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      # The login email is set by the admin. Leaving email out of WriteAttributes stops a merchant changing it.
      WriteAttributes: [given_name]
      SupportedIdentityProviders: [COGNITO]
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true

  # One HTTP API. A token from the wrong pool fails the issuer and audience check, so it gets 401 before any Lambda runs (design D3).
  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      # Cost guard (design D8). HTTP APIs throttle per route, not per stage, so the worst case is
      # 17 routes x 10 rps. A true stage-wide cap would need WAF, which costs money.
      DefaultRouteSettings:
        ThrottlingRateLimit: 10
        ThrottlingBurstLimit: 20
      Auth:
        EnableIamAuthorizer: true
        # A route added without an Auth block is consumer-only, never public.
        DefaultAuthorizer: ConsumerAuth
        Authorizers:
          ConsumerAuth:
            JwtConfiguration:
              issuer: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${ConsumerUserPool}'
              # The apps send the ID token, whose aud is the app client ID. Its claims give GET /me the email and name (design D4).
              audience: [!Ref ConsumerAppClient]
            IdentitySource: $request.header.Authorization
          MerchantAuth:
            JwtConfiguration:
              issuer: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${MerchantUserPool}'
              audience: [!Ref MerchantAppClient]
            IdentitySource: $request.header.Authorization

  # Four functions grouped by audience (design D2). Each gets only the access its routes need.
  DiscoveryFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        OutExtension: [.js=.mjs]
        Target: es2023
        # Unminified with the SDK bundled: readable stack traces without source maps, and no reliance on the runtime SDK version.
        Minify: false
        # The bundled AWS SDK is CommonJS and calls require(), which an ESM bundle lacks unless we create it.
        Banner:
          - "js=import { createRequire } from 'node:module'; const require = createRequire(import.meta.url);"
        EntryPoints: [src/handlers/discovery.ts]
    Properties:
      CodeUri: ./
      Handler: discovery.handler
      Events:
        ListCategories:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: GET
            Path: /categories
            Auth:
              Authorizer: NONE
        DiscoverOffers:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: GET
            Path: /discovery
            Auth:
              Authorizer: ConsumerAuth
        SearchLocations:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: GET
            Path: /locations
            Auth:
              Authorizer: ConsumerAuth
        GetMerchant:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: GET
            Path: /merchants/{merchantId}
            Auth:
              Authorizer: ConsumerAuth
      LoggingConfig:
        LogGroup: !Ref DiscoveryLogGroup
      Environment:
        Variables:
          IMAGE_BASE_URL: !Sub 'https://${ImageDistribution.DomainName}/'
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:Query
              Resource:
                - !GetAtt Table.Arn
                - !Sub '${Table.Arn}/index/GSI2'

  ConsumerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        OutExtension: [.js=.mjs]
        Target: es2023
        # Unminified with the SDK bundled: readable stack traces without source maps, and no reliance on the runtime SDK version.
        Minify: false
        # The bundled AWS SDK is CommonJS and calls require(), which an ESM bundle lacks unless we create it.
        Banner:
          - "js=import { createRequire } from 'node:module'; const require = createRequire(import.meta.url);"
        EntryPoints: [src/handlers/consumer.ts]
    Properties:
      CodeUri: ./
      Handler: consumer.handler
      Events:
        GetOfferQr:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: GET
            Path: /merchants/{merchantId}/offers/{offerId}/qr
            Auth:
              Authorizer: ConsumerAuth
        GetMe:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: GET
            Path: /me
            Auth:
              Authorizer: ConsumerAuth
        DeleteMe:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: DELETE
            Path: /me
            Auth:
              Authorizer: ConsumerAuth
        ListMyRedemptions:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: GET
            Path: /me/redemptions
            Auth:
              Authorizer: ConsumerAuth
      LoggingConfig:
        LogGroup: !Ref ConsumerLogGroup
      Environment:
        Variables:
          QR_KEY_PARAMETER: !Ref QrKeyParameterName
          CONSUMER_USER_POOL_ID: !Ref ConsumerUserPool
          QR_KEY: ''
      Policies:
        - Statement:
            # AdminGetUser or ListUsers finds the consumer by sub (federated usernames differ from the sub), then AdminDeleteUser removes it.
            - Effect: Allow
              Action: [cognito-idp:AdminGetUser, cognito-idp:ListUsers, cognito-idp:AdminDeleteUser]
              Resource: !GetAtt ConsumerUserPool.Arn
            # GetItem checks an offer before issuing a QR value. Query reads history from GSI1.
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt Table.Arn
            - Effect: Allow
              Action: dynamodb:Query
              Resource: !Sub '${Table.Arn}/index/GSI1'
            # DELETE /me only removes the consumer link from redemptions (design D5), so UpdateItem may touch nothing else.
            - Effect: Allow
              Action: dynamodb:UpdateItem
              Resource: !GetAtt Table.Arn
              Condition:
                ForAllValues:StringEquals:
                  dynamodb:Attributes: [PK, SK, userId, displayName, GSI1PK, GSI1SK]
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${QrKeyParameterName}'

  MerchantFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        OutExtension: [.js=.mjs]
        Target: es2023
        # Unminified with the SDK bundled: readable stack traces without source maps, and no reliance on the runtime SDK version.
        Minify: false
        # The bundled AWS SDK is CommonJS and calls require(), which an ESM bundle lacks unless we create it.
        Banner:
          - "js=import { createRequire } from 'node:module'; const require = createRequire(import.meta.url);"
        EntryPoints: [src/handlers/merchant.ts]
    Properties:
      CodeUri: ./
      Handler: merchant.handler
      Events:
        GetMerchantMe:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: GET
            Path: /merchant/me
            Auth:
              Authorizer: MerchantAuth
        ListMerchantOffers:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: GET
            Path: /merchant/offers
            Auth:
              Authorizer: MerchantAuth
        CreateOffer:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: POST
            Path: /merchant/offers
            Auth:
              Authorizer: MerchantAuth
        UpdateOffer:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: PATCH
            Path: /merchant/offers/{offerId}
            Auth:
              Authorizer: MerchantAuth
        DeleteOffer:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: DELETE
            Path: /merchant/offers/{offerId}
            Auth:
              Authorizer: MerchantAuth
        RequestOfferImageUpload:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: POST
            Path: /merchant/offers/{offerId}/image
            Auth:
              Authorizer: MerchantAuth
        ListMerchantRedemptions:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: GET
            Path: /merchant/redemptions
            Auth:
              Authorizer: MerchantAuth
        RecordRedemption:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: POST
            Path: /merchant/redemptions
            Auth:
              Authorizer: MerchantAuth
      LoggingConfig:
        LogGroup: !Ref MerchantLogGroup
      Environment:
        Variables:
          QR_KEY_PARAMETER: !Ref QrKeyParameterName
          IMAGE_BUCKET: !Ref ImageBucket
          CONSUMER_USER_POOL_ID: !Ref ConsumerUserPool
          QR_KEY: ''
          S3_ENDPOINT: ''
          S3_PUBLIC_ENDPOINT: ''
          S3_ACCESS_KEY_ID: ''
          S3_SECRET_ACCESS_KEY: ''
          IMAGE_BASE_URL: !Sub 'https://${ImageDistribution.DomainName}/'
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem, dynamodb:Query]
              Resource: !GetAtt Table.Arn
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${QrKeyParameterName}'
            # The scan looks the consumer up by sub: AdminGetUser for native users, ListUsers for federated ones (design D4).
            # Accepted risk: IAM cannot limit ListUsers to one sub, so this role can list the consumer directory.
            - Effect: Allow
              Action: [cognito-idp:AdminGetUser, cognito-idp:ListUsers]
              Resource: !GetAtt ConsumerUserPool.Arn
            # PutObject signs the presigned POST, GetObject backs HeadObject. The merchant-ID prefix is checked in code.
            - Effect: Allow
              Action: [s3:PutObject, s3:GetObject, s3:DeleteObject]
              Resource: !Sub '${ImageBucket.Arn}/offers/*'
            # Without ListBucket, HeadObject answers a missing key with 403, which looks like a permission error.
            # No s3:prefix condition: HeadObject sends no prefix, so the condition would never match. The bucket holds only offers/.
            - Effect: Allow
              Action: s3:ListBucket
              Resource: !GetAtt ImageBucket.Arn

  AdminFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        OutExtension: [.js=.mjs]
        Target: es2023
        # Unminified with the SDK bundled: readable stack traces without source maps, and no reliance on the runtime SDK version.
        Minify: false
        # The bundled AWS SDK is CommonJS and calls require(), which an ESM bundle lacks unless we create it.
        Banner:
          - "js=import { createRequire } from 'node:module'; const require = createRequire(import.meta.url);"
        EntryPoints: [src/handlers/admin.ts]
    Properties:
      CodeUri: ./
      Handler: admin.handler
      Events:
        CreateMerchant:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: POST
            Path: /admin/merchants
            Auth:
              Authorizer: AWS_IAM
      LoggingConfig:
        LogGroup: !Ref AdminLogGroup
      Environment:
        Variables:
          MERCHANT_USER_POOL_ID: !Ref MerchantUserPool
      Policies:
        - Statement:
            - Effect: Allow
              # AdminGetUser finds the account a failed earlier create left behind, so a retry can repair it.
              Action: [cognito-idp:AdminCreateUser, cognito-idp:AdminGetUser, cognito-idp:AdminDeleteUser]
              Resource: !GetAtt MerchantUserPool.Arn
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem]
              Resource: !GetAtt Table.Arn

  DiscoveryLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/localbargain/${AWS::StackName}/discovery'
      RetentionInDays: 14
  ConsumerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/localbargain/${AWS::StackName}/consumer'
      RetentionInDays: 14
  MerchantLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/localbargain/${AWS::StackName}/merchant'
      RetentionInDays: 14
  AdminLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/localbargain/${AWS::StackName}/admin'
      RetentionInDays: 14

Outputs:
  ApiUrl:
    Value: !Sub 'https://${Api}.execute-api.${AWS::Region}.amazonaws.com'
  MerchantUserPoolId:
    Value: !Ref MerchantUserPool
  MerchantAppClientId:
    Value: !Ref MerchantAppClient
  ConsumerUserPoolId:
    Value: !Ref ConsumerUserPool
  ConsumerAppClientId:
    Value: !Ref ConsumerAppClient
  ConsumerHostedUiDomain:
    Value: !Sub 'https://${ConsumerUserPoolDomain}.auth.${AWS::Region}.amazoncognito.com'
  TableName:
    Value: !Ref Table
  ImageBucketName:
    Value: !Ref ImageBucket
  ImageBaseUrl:
    Value: !Sub 'https://${ImageDistribution.DomainName}/'
