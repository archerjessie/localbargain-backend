# Local mode (design D9): DynamoDB Local and MinIO for `sam local start-api --docker-network localbargain`.
name: localbargain

services:
  dynamodb:
    image: amazon/dynamodb-local:3.3.2
    command: -jar DynamoDBLocal.jar -sharedDb -inMemory
    ports: ['8000:8000']
    healthcheck:
      test: ['CMD-SHELL', 'curl -s -o /dev/null http://localhost:8000 || exit 1']
      interval: 2s
      retries: 30

  minio:
    # The minio/minio images were withdrawn from Docker Hub in 2025. This is the last MinIO build Bitnami published.
    # shortcut: frozen image with no security updates, fine for a local-only emulator; move to a maintained S3 emulator if one fits.
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    environment:
      MINIO_ROOT_USER: localbargain
      MINIO_ROOT_PASSWORD: localbargain-secret
      # ":download" makes the bucket anonymously readable, so the emulator can load imageUrl directly.
      MINIO_DEFAULT_BUCKETS: localbargain-images:download
    ports: ['9000:9000', '9001:9001']
    healthcheck:
      # Healthy only once the bucket and its anonymous-read policy exist: an anonymous GET then says NoSuchKey, not NoSuchBucket.
      test: ['CMD-SHELL', 'curl -s http://localhost:9000/localbargain-images/healthcheck | grep -q NoSuchKey']
      interval: 2s
      retries: 30

networks:
  default:
    name: localbargain
